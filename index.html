<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-zh="三只猫清洁 · 在线报价（演示版）" data-en="Three Cats Cleaning · Online Quote (Demo)">三只猫清洁 · 在线报价（演示版）</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f2f2f7;color:#1d1d1f;line-height:1.5;padding-bottom:56px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header{background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:16px;display:flex;align-items:center;justify-content:center;gap:14px;border-bottom:1px solid rgba(0,0,0,.06);position:sticky;top:0;z-index:10}
.logo{width:60px;height:60px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.htext{text-align:left}
.htext h1{font-size:21px;font-weight:700;letter-spacing:-.3px}
.htext p{font-size:13px;color:#6e6e73;margin-top:2px}
.photo-strip{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 4px}
.photo-strip img{height:120px;border-radius:14px;flex:none}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:20px;padding:22px;margin-top:16px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.field{margin-bottom:22px}
.field>label{display:block;font-weight:600;margin-bottom:10px;font-size:16px;letter-spacing:-.2px}
.req{color:#ff3b30}
input[type=text],input[type=number],input[type=tel],select,textarea{width:100%;padding:13px 14px;border:1px solid #d1d1d6;border-radius:12px;font-size:16px;background:#fff;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1d7a3a;box-shadow:0 0 0 3px rgba(29,122,58,.14)}
input[type=file]{padding:12px;border:1.5px dashed #d1d1d6;border-radius:12px;width:100%;background:#fafafc;font-size:14px;color:#6e6e73}
.seg{display:flex;background:#e9e9ee;border-radius:14px;padding:3px;gap:3px}
.seg label{flex:1;position:relative;min-width:0;margin:0}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:11px 4px;font-size:15px;border-radius:11px;color:#3a3a3c;transition:all .18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.seg input:checked+span{background:#fff;color:#1d1d1f;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.hint{font-size:12px;color:#8e8e93;margin-top:8px;line-height:1.5}
.hidden{display:none!important}
.btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#1d7a3a,#31a24c);color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;margin-top:8px;box-shadow:0 4px 14px rgba(29,122,58,.3);transition:transform .08s}
.btn:active{transform:scale(.98)}
.est{background:linear-gradient(135deg,#1d7a3a,#31a24c);color:#fff;border-radius:20px;padding:36px 20px;text-align:center;margin-top:16px;box-shadow:0 10px 30px rgba(29,122,58,.3)}
.est .price{font-size:60px;font-weight:700;letter-spacing:-1.5px;margin:8px 0;line-height:1.1}
.est .note{font-size:14px;opacity:.92}
.est-manual{background:linear-gradient(135deg,#b57a12,#d99a2b);box-shadow:0 10px 30px rgba(181,122,18,.28)}
.est-manual .price{font-size:36px}
.kv{font-size:14px;color:#6e6e73;margin-top:12px;text-align:left;line-height:1.7}
.kv b{color:#1d1d1f;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th,td{border:1px solid #e5e5e5;padding:8px;text-align:left;vertical-align:top}
th{background:#f0f2f0;white-space:nowrap}
.back{display:inline-block;margin-top:14px;color:#1d7a3a;font-size:15px;font-weight:500;text-decoration:none}
.err{background:#fdecea;border:1.5px solid #ff3b30;border-radius:16px;padding:18px;margin-top:16px;color:#1d1d1f}
.notes{background:#fff7e8;border:1px solid #e0b34c;border-radius:12px;padding:12px 14px;font-size:13px;color:#7a5b12;margin-top:12px;line-height:1.6}
.tip{background:#eef7f2;border-radius:12px;padding:12px 14px;font-size:13px;color:#14532d;line-height:1.6;margin-bottom:6px}
.lang-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:1px solid #d1d1d6;background:#fff;border-radius:20px;padding:6px 14px;font-size:14px;font-weight:600;color:#1d1d1f;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.lang-btn:active{transform:translateY(-50%) scale(.95)}
.demo-tag{display:inline-block;background:#fff7e8;border:1px solid #e0b34c;color:#7a5b12;font-size:12px;border-radius:20px;padding:2px 12px;margin-top:8px}</style></head>

<div class="field"><label><span data-zh="3. 房子官方总面积（平方英尺）" data-en="3. Official total home size (sq ft)">3. 房子官方总面积（平方英尺）</span> <span class="req">*</span></label>
<input type="number" name="area_sqft" min="1" step="any" required placeholder="例如 1200" data-zh-ph="例如 1200" data-en-ph="e.g. 1200"></div>
<div class="field"><label><span data-zh="4. 城市邮编" data-en="4. City ZIP code">4. 城市邮编</span> <span class="req">*</span></label>
<input type="text" name="zipcode" required inputmode="numeric" placeholder="例如 98005" data-zh-ph="例如 98005" data-en-ph="e.g. 98005"></div>
<div class="field"><label><span data-zh="5. 入住 / 上市 / 退租 / 正在居住？" data-en="5. Moving in / Listing / Moving out / Living here?">5. 入住 / 上市 / 退租 / 正在居住？</span> <span class="req">*</span></label>
<div class="seg">
<label><input type="radio" name="house_status" value="入住" required><span data-zh="入住" data-en="Moving in">入住</span></label>
<label><input type="radio" name="house_status" value="上市"><span data-zh="上市" data-en="Listing">上市</span></label>
<label><input type="radio" name="house_status" value="退租"><span data-zh="退租" data-en="Moving out">退租</span></label>
<label><input type="radio" name="house_status" value="正在居住"><span data-zh="正在居住" data-en="Living here">正在居住</span></label>
</div></div>
<div class="field"><label><span data-zh="6. 地毯有几个区域？" data-en="6. How many carpet areas?">6. 地毯有几个区域？</span> <span class="req">*</span></label>
<input type="number" name="carpet_rooms" min="1" required placeholder="例如 3" data-zh-ph="例如 3" data-en-ph="e.g. 3">
<p class="hint" data-zh="区域：每个房间、厅、餐厅、过道走廊、一楼到二楼楼梯各算一个区域" data-en="Each bedroom, living room, dining room, hallway, and the 1st-to-2nd-floor stairs counts as one area">区域：每个房间、厅、餐厅、过道走廊、一楼到二楼楼梯各算一个区域</p>
<label style="font-weight:600;font-size:15px;margin-top:10px;display:block"><span data-zh="清洗类型" data-en="Cleaning type">清洗类型</span> <span class="req">*</span></label>
<div class="seg" style="margin-top:8px">
<label><input type="radio" name="clean_type" value="普通蒸汽清洗" required><span data-zh="普通蒸汽清洗" data-en="Standard steam cleaning">普通蒸汽清洗</span></label>
<label><input type="radio" name="clean_type" value="专业深度清洗"><span data-zh="专业深度清洗" data-en="Professional deep cleaning">专业深度清洗</span></label>
</div>
<div class="notes"><b data-zh="请注意：" data-en="Please note:">请注意：</b><br><span data-zh="报价前提：无宠物污渍、无发霉黑边、无大面积重油污/粉尘/颜料，否则价格另议" data-en="Quote assumes: no pet stains, no moldy black edges, no heavy grease/dust/paint; otherwise priced separately">报价前提：无宠物污渍、无发霉黑边、无大面积重油污/粉尘/颜料，否则价格另议</span><br><span data-zh="区域数量以师傅上门核对为准" data-en="Final area count confirmed on site">区域数量以师傅上门核对为准</span></div></div>
<div class="field"><label data-zh="备注 / 污渍照片（选填）" data-en="Notes / Stain photos (optional)">备注 / 污渍照片（选填）</label>
<textarea name="notes" rows="3" placeholder="如有严重污渍（宠物污渍、发霉黑边、大面积油污等），请简单描述" data-zh-ph="如有严重污渍（宠物污渍、发霉黑边、大面积油污等），请简单描述" data-en-ph="If there are tough stains (pet stains, moldy edges, heavy grease, etc.), please describe briefly"></textarea>
<input type="file" name="stain_photos" accept="image/*" multiple style="margin-top:8px">
<p class="hint" data-zh="也可以直接上传污渍部位的照片；有备注或照片时我们会人工报价" data-en="You can also upload photos of the stains; with notes or photos we'll quote manually">也可以直接上传污渍部位的照片；有备注或照片时我们会人工报价</p></div>
<div class="field"><label><span data-zh="您的姓名" data-en="Your name">您的姓名</span> <span class="req">*</span></label>
<input type="text" name="name" required placeholder="怎么称呼您" data-zh-ph="怎么称呼您" data-en-ph="Your name"></div>
<div class="field"><label data-zh="联系电话" data-en="Phone">联系电话</label>
<input type="tel" name="phone" placeholder="选填" data-zh-ph="选填" data-en-ph="Optional">
<p class="hint" data-zh="电话和微信号至少填一个，我们跟您确认最终价格用" data-en="Please provide at least one of phone or WeChat ID; we'll use it to confirm your final price">电话和微信号至少填一个，我们跟您确认最终价格用</p></div>
<div class="field"><label data-zh="微信号" data-en="WeChat ID">微信号</label>
<input type="text" name="wechat" placeholder="选填" data-zh-ph="选填" data-en-ph="Optional"></div>
<button class="btn" type="submit" data-zh="获取预估价" data-en="Get Estimate">获取预估价</button>
<p class="hint" style="text-align:center;margin-top:10px" data-zh="提交后立即显示预估价，最终价格以人工确认为准" data-en="Your estimate shows right after submitting; final price subject to manual confirmation">提交后立即显示预估价，最终价格以人工确认为准</p>
</form></div>
<div class="wrap hidden" id="resultWrap"></div>
<script>
function sync(){
  var apt=document.querySelector('input[name=property_type]:checked');
  var showF=!!(apt&&apt.value==='公寓');
  document.getElementById('floorWrap').classList.toggle('hidden',!showF);
  document.querySelector('input[name=floor]').required=showF;
}
document.querySelectorAll('input[name=property_type]').forEach(function(r){r.addEventListener('change',sync);});
function val(name){var el=document.querySelector('[name='+name+']:checked')||document.querySelector('[name='+name+']');return el?el.value.trim():'';}
function unitPrice(area,ct){var b=area<=2000?60:area<=3000?70:area<=4000?80:90;return ct==='专业深度清洗'?b*2:b;}
document.getElementById('quoteForm').addEventListener('submit',function(e){
  e.preventDefault();
  var errs=[];
  var pt=val('property_type');if(!pt)errs.push('请选择公寓还是 House');
  var floor=val('floor');if(pt==='公寓'&&!floor)errs.push('公寓请填写几楼');
  var area=parseFloat(val('area_sqft'));if(!(area>0))errs.push('房子官方总面积请填写数字（平方英尺）');
  var zc=val('zipcode');if(!zc)errs.push('请填写城市邮编');
  var hs=val('house_status');if(!hs)errs.push('请选择房屋状态');
  var rooms=parseInt(val('carpet_rooms'),10);if(!(rooms>0))errs.push('地毯区域数请填写数字');
  var ct=val('clean_type');if(!ct)errs.push('请选择清洗类型');
  var name=val('name');if(!name)errs.push('请填写姓名');
  var phone=val('phone'),wechat=val('wechat');if(!phone&&!wechat)errs.push('电话和微信号请至少填一个');
  var rw=document.getElementById('resultWrap');
  var ENMAP={'公寓':'Apartment','House':'House','入住':'Moving in','上市':'Listing','退租':'Moving out','正在居住':'Living here','普通蒸汽清洗':'standard steam cleaning','专业深度清洗':'professional deep cleaning'};
  var ERREN={'请选择公寓还是 House':'Please choose apartment or house','公寓请填写几楼':'Please enter the floor for apartments','房子官方总面积请填写数字（平方英尺）':'Please enter the official total home size as a number (sq ft)','请填写城市邮编':'Please enter the city ZIP code','请选择房屋状态':'Please choose the home status','地毯区域数请填写数字':'Please enter the carpet area count as a number','请选择清洗类型':'Please choose a cleaning type','请填写姓名':'Please enter your name','电话和微信号请至少填一个':'Please provide at least one of phone number or WeChat ID'};
  function bi(zh,en){return '<span data-zh="'+zh+'" data-en="'+en+'">'+zh+'</span>';}
  if(errs.length){rw.classList.remove('hidden');rw.innerHTML='<div class="err">'+bi('请检查：','Please check:')+'<br>· '+errs.map(function(e){return bi(e,ERREN[e]||e);}).join('<br>· ')+'</div><a class="back" id="backBtn">'+bi('← 返回修改','← Go back')+'</a>';document.getElementById('formWrap').classList.add('hidden');bindBack();tcSetLang(tcCurLang());window.scrollTo(0,0);return;}
  var notes=val('notes');
  var files=document.querySelector('input[name=stain_photos]').files;
  var manual=!!(notes||files.length);
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var unit=unitPrice(area,ct),total=unit*rooms;
  rw.classList.remove('hidden');
  var estBox=manual
    ?'<div class="est est-manual"><div>'+bi('预估价格','Estimated price')+'</div><div class="price">'+bi('需人工报价','Manual quote needed')+'</div><div class="note">'+bi('您留了备注或污渍照片，我们会尽快联系您确认价格',"You left notes or stain photos; we'll contact you soon to confirm the price")+'</div>'
    :'<div class="est"><div>'+bi('预估价格','Estimated price')+'</div><div class="price">$'+total+'</div><div class="note">'+bi('地毯'+ct+' $'+unit+'/区域 × '+rooms+' 个区域，最终价格以人工确认为准','Carpet '+(ENMAP[ct]||ct)+' $'+unit+'/area × '+rooms+' areas, final price subject to manual confirmation')+'</div>';
  estBox+='<div class="notes" style="text-align:left;margin-top:12px"><b data-zh="请注意：" data-en="Please note:">请注意：</b><br><span data-zh="报价前提：无宠物污渍、无发霉黑边、无大面积重油污/粉尘/颜料，否则价格另议" data-en="Quote assumes: no pet stains, no moldy black edges, no heavy grease/dust/paint; otherwise priced separately">报价前提：无宠物污渍、无发霉黑边、无大面积重油污/粉尘/颜料，否则价格另议</span><br><span data-zh="区域数量以师傅上门核对为准" data-en="Final area count confirmed on site">区域数量以师傅上门核对为准</span></div></div>';
  var extraKv='';
  if(notes)extraKv+='<br><b>'+bi('备注：','Notes:')+'</b>'+esc(notes);
  if(files.length)extraKv+='<br><b>'+bi('污渍照片：','Stain photos:')+'</b>'+bi('已选 '+files.length+' 张（演示版不真上传）',files.length+' selected (demo does not upload)');
  rw.innerHTML=estBox+
    '<div class="card"><div class="kv"><b>'+bi('服务：','Service:')+'</b>'+bi('地毯清洗','Carpet cleaning')+'<br><b>'+bi('房型：','Home:')+'</b>'+bi(pt+(floor?' · '+floor+' 楼':''),(ENMAP[pt]||pt)+(floor?' · Floor '+floor:''))+'<br>'+
    '<b>'+bi('面积：','Size:')+'</b>'+area+' sqft<br><b>'+bi('邮编：','ZIP:')+'</b>'+esc(zc)+'<br><b>'+bi('房屋状态：','Status:')+'</b>'+bi(hs,ENMAP[hs]||hs)+'<br>'+
    '<b>'+bi('地毯：','Carpet:')+'</b>'+bi(rooms+' 个区域 · '+ct,rooms+' areas · '+(ENMAP[ct]||ct))+'<br><b>'+bi('联系人：','Name:')+'</b>'+esc(name)+'<br><b>'+bi('电话：','Phone:')+'</b>'+esc(phone)+'<br><b>'+bi('微信：','WeChat:')+'</b>'+esc(wechat)+extraKv+'</div>'+
    '<p class="hint" style="margin-top:8px">'+bi('演示版：仅显示预估价，不会真的提交预约','Demo: estimate only, nothing is actually submitted')+'</p></div>'+
    '<a class="back" id="backBtn">'+bi('← 再算一次','← Calculate again')+'</a>';
  document.getElementById('formWrap').classList.add('hidden');bindBack();tcSetLang(tcCurLang());window.scrollTo(0,0);
});
function bindBack(){var b=document.getElementById('backBtn');if(b)b.addEventListener('click',function(){document.getElementById('resultWrap').classList.add('hidden');document.getElementById('formWrap').classList.remove('hidden');window.scrollTo(0,0);});}
</script>
<script>
var tcLang='zh';
try{tcLang=localStorage.getItem('tc_lang')||'zh';}catch(e){}
function tcCurLang(){return tcLang;}
function tcSetLang(l){
  tcLang=l;
  document.documentElement.lang=(l==='en'?'en':'zh-CN');
  document.querySelectorAll('[data-en]').forEach(function(el){el.textContent=el.dataset[l==='en'?'en':'zh'];});
  document.querySelectorAll('[data-en-ph]').forEach(function(el){el.placeholder=el.dataset[l==='en'?'enPh':'zhPh'];});
  var b=document.getElementById('langBtn');if(b)b.textContent=(l==='en'?'\u4e2d\u6587':'EN');
  try{localStorage.setItem('tc_lang',l);}catch(e){}
}
(function(){var b=document.getElementById('langBtn');if(b)b.addEventListener('click',function(){tcSetLang(tcLang==='zh'?'en':'zh');});tcSetLang(tcLang);})();
</script>
</body></html>
